services:
  primario:
    image: postgres:16
    container_name: pg-primario
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: tienda
    command: postgres -c wal_level=replica -c max_wal_senders=10 -c hot_standby=on
    ports:
      - "5432:5432"
    volumes:
      - ./init-primario.sh:/docker-entrypoint-initdb.d/init-primario.sh

  replica:
    image: postgres:16
    container_name: pg-replica
    user: postgres
    depends_on:
      - primario
    environment:
      PGPASSWORD: replica123
    ports:
      - "5434:5432"
    command: >
      bash -c "
      until pg_basebackup -h primario -U replicador -D /var/lib/postgresql/data -R -X stream -P; do
        echo 'Esperando al primario...'; sleep 3;
      done;
      chmod 700 /var/lib/postgresql/data;
      exec postgres
      "